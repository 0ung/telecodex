name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - worker
          - gateway

concurrency:
  group: telecodex-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest tests

  package:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Build release archive
        id: meta
        run: |
          release_id="${GITHUB_SHA::12}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=__pycache__ \
            -czf "telecodex-${release_id}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: telecodex-release
          path: telecodex-${{ steps.meta.outputs.release_id }}.tar.gz
          if-no-files-found: error

  deploy-worker:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'worker'
    env:
      DEPLOY_HOST: ${{ vars.TELECODEX_WORKER_HOST }}
      DEPLOY_USER: ${{ vars.TELECODEX_SSH_USER || 'ubuntu' }}
      DEPLOY_ROOT: ${{ vars.TELECODEX_DEPLOY_ROOT || '/opt/telecodex' }}
      KEEP_RELEASES: ${{ vars.TELECODEX_KEEP_RELEASES || '5' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: telecodex-release
          path: dist

      - name: Validate worker deploy configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "${{ secrets.TELECODEX_WORKER_SSH_KEY }}"

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.TELECODEX_WORKER_SSH_KEY }}" > ~/.ssh/telecodex_worker
          chmod 600 ~/.ssh/telecodex_worker
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload worker release
        run: |
          archive_path="$(find dist -maxdepth 1 -name 'telecodex-*.tar.gz' -print -quit)"
          scp -i ~/.ssh/telecodex_worker "$archive_path" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/telecodex-release.tar.gz"
          scp -i ~/.ssh/telecodex_worker deploy/remote-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/telecodex-remote-release.sh"

      - name: Deploy worker
        run: |
          ssh -i ~/.ssh/telecodex_worker "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/telecodex-remote-release.sh && \
             APP_ROOT='$DEPLOY_ROOT' KEEP_RELEASES='$KEEP_RELEASES' SERVICE_NAME='telecodex-worker' \
             /tmp/telecodex-remote-release.sh worker /tmp/telecodex-release.tar.gz '${{ needs.package.outputs.release_id }}'"

  deploy-gateway:
    runs-on: ubuntu-latest
    needs:
      - package
      - deploy-worker
    if: |
      always() &&
      (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'gateway') &&
      (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    env:
      DEPLOY_HOST: ${{ vars.TELECODEX_GATEWAY_HOST }}
      DEPLOY_USER: ${{ vars.TELECODEX_SSH_USER || 'ubuntu' }}
      DEPLOY_ROOT: ${{ vars.TELECODEX_DEPLOY_ROOT || '/opt/telecodex' }}
      KEEP_RELEASES: ${{ vars.TELECODEX_KEEP_RELEASES || '5' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: telecodex-release
          path: dist

      - name: Validate gateway deploy configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "${{ secrets.TELECODEX_GATEWAY_SSH_KEY }}"

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.TELECODEX_GATEWAY_SSH_KEY }}" > ~/.ssh/telecodex_gateway
          chmod 600 ~/.ssh/telecodex_gateway
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload gateway release
        run: |
          archive_path="$(find dist -maxdepth 1 -name 'telecodex-*.tar.gz' -print -quit)"
          scp -i ~/.ssh/telecodex_gateway "$archive_path" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/telecodex-release.tar.gz"
          scp -i ~/.ssh/telecodex_gateway deploy/remote-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/telecodex-remote-release.sh"

      - name: Deploy gateway
        run: |
          ssh -i ~/.ssh/telecodex_gateway "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/telecodex-remote-release.sh && \
             APP_ROOT='$DEPLOY_ROOT' KEEP_RELEASES='$KEEP_RELEASES' SERVICE_NAME='telecodex-gateway' \
             /tmp/telecodex-remote-release.sh gateway /tmp/telecodex-release.tar.gz '${{ needs.package.outputs.release_id }}'"
