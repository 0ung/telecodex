host: "127.0.0.1"
port: 8081
workspace_root: "/opt/telecodex/current"
runs_dir: "/opt/telecodex/.runs-single-node"
max_turns: 6
max_turns_cap: 6
dynamic_turn_budget: false
max_codex_failures: 2
dry_run: false
print_io: false
worker_token: ""
execution_policy:
  # Empty allow list means Codex can use normal development commands.
  # Keep destructive commands in deny_commands instead of trying to enumerate every safe tool.
  allow_commands: []
  deny_commands:
    - rm
    - del
gemini:
  protocol: "gemini_cli"
  command: "/absolute/path/to/gemini"
  args: []
  model: "gemini-2.5-flash"
  timeout_sec: 120
  retries: 1
codex:
  protocol: "codex_app_server"
  command: "/absolute/path/to/codex"
  args: []
  model: ""
  timeout_sec: 900
  retries: 0
  default_commands:
    - "pytest"
