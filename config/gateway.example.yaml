channel_provider: "telegram"
telegram_token: "123456:replace-me"
allowed_user_ids:
  - 123456789
worker_base_url: "http://10.20.0.10:8081"
worker_token: "replace-me"
poll_timeout_sec: 30
request_timeout_sec: 30
request_connect_timeout_sec: 5
request_read_timeout_sec: 30
request_write_timeout_sec: 30
request_pool_timeout_sec: 5
request_max_retries: 2
request_retry_backoff_sec: 0.5
session_push_interval_sec: 5
max_attachment_bytes: 5242880
max_total_attachment_bytes: 10485760
allowed_attachment_mime_types:
  - "image/jpeg"
  - "image/png"
  - "image/webp"
  - "application/pdf"
  - "text/plain"
  - "text/markdown"
  - "application/json"
