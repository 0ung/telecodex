host: "0.0.0.0"
port: 8081
workspace_root: "."
runs_dir: "./.runs-python"
max_turns: 6
max_turns_cap: 6
dynamic_turn_budget: false
max_codex_failures: 2
dry_run: true
print_io: false
worker_token: "replace-me"
execution_policy:
  allow_commands:
    - bash
    - cat
    - find
    - git
    - ls
    - pwd
    - python
    - pytest
    - rg
    - sed
  deny_commands:
    - rm
    - del
gemini:
  protocol: "gemini_cli"
  command: "gemini"
  args: []
  model: "gemini-2.5-flash-lite"
  timeout_sec: 120
  retries: 1
  mock_responses:
    - status: "continue"
      summary_for_user: "Planner approved the initial implementation."
      instruction_for_codex: "Implement the requested Python worker flow."
      reason: "dry-run continue"
codex:
  protocol: "codex_responses_local_shell"
  api_base_url: "https://api.openai.com/v1"
  args: []
  model: "codex-mini-latest"
  timeout_sec: 120
  retries: 0
  default_commands:
    - "pytest"
  mock_responses:
    - status: "completed"
      changed_files:
        - "src/telecodex/worker/orchestrator.py"
      commands_run:
        - "pytest"
      summary: "Dry-run worker implementation completed."
      raw_output: "ok"
