host: "0.0.0.0"
port: 8081
workspace_root: "."
runs_dir: "./.runs-python"
max_turns: 6
max_turns_cap: 6
dynamic_turn_budget: false
max_codex_failures: 2
max_attachment_bytes: 5000000
dry_run: true
print_io: false
worker_token: "replace-me"
execution_policy:
  # Empty allow list means Codex can use normal development commands.
  # Keep destructive commands in deny_commands instead of trying to enumerate every safe tool.
  allow_commands: []
  deny_commands:
    - rm
    - del
gemini:
  protocol: "gemini_cli"
  command: "gemini"
  args: []
  model: "gemini-2.5-flash"
  timeout_sec: 120
  retries: 1
  mock_responses:
    - status: "continue"
      verdict: "continue"
      summary_for_user: "Planner approved the initial implementation."
      instruction_for_codex: "Implement the requested Python worker flow."
      acceptance_criteria:
        - "Implement the requested Python worker flow."
        - "Run the configured verification command or explain why it could not run."
      reason: "dry-run continue"
    - status: "done"
      verdict: "done"
      summary_for_user: "The session goal is complete."
      completed_acceptance_criteria:
        - "Implement the requested Python worker flow."
        - "Run the configured verification command or explain why it could not run."
codex:
  protocol: "codex_app_server"
  command: "codex"
  args: []
  model: ""
  timeout_sec: 900
  retries: 0
  default_commands:
    - "pytest"
  mock_responses:
    - status: "completed"
      changed_files:
        - "src/telecodex/worker/orchestrator.py"
      commands_run:
        - "pytest"
      summary: "Dry-run worker implementation completed."
      verified_acceptance_criteria:
        - "Implement the requested Python worker flow."
        - "Run the configured verification command or explain why it could not run."
      proposed_completion: true
      raw_output: "ok"
